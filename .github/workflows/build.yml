name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B package

      # Behavior check via the standalone simulator: 60 rapid OAK_LOG breaks
      # must NOT report (tree-block exemption), 60 STONE breaks must report.
      - name: Simulator smoke test (tree-block exemption)
        run: |
          printf 'break Alice 60 OAK_LOG\nbreak Bob 60 STONE\n' \
            | mvn -q compile exec:java > sim-out.txt 2>&1 || true
          cat sim-out.txt
          grep -q 'REPORT.*rapid-break.*Bob' sim-out.txt \
            || { echo 'FAIL: expected rapid-break report for Bob (STONE)'; exit 1; }
          grep -q 'REPORT.*Alice' sim-out.txt \
            && { echo 'FAIL: Alice (OAK_LOG) should be exempt'; exit 1; }
          echo 'smoke test passed'

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Tattle
          path: target/Tattle-*.jar

      - name: Build ClaimDeeds
        if: github.ref == 'refs/heads/claude/tattle-minecraft-deploy-ldhlpx'
        run: mvn -B -f extras/claimdeeds/pom.xml package

      - name: Fetch third-party plugins from Modrinth
        if: github.ref == 'refs/heads/claude/tattle-minecraft-deploy-ldhlpx'
        run: bash extras/fetch-plugins.sh

      # Commit built + fetched jars back to the deploy branch so environments
      # without access to artifact storage can fetch them over git.
      - name: Commit jars to deploy branch
        if: github.ref == 'refs/heads/claude/tattle-minecraft-deploy-ldhlpx'
        run: |
          mkdir -p dist/plugins
          cp target/Tattle-*.jar dist/
          cp extras/claimdeeds/target/ClaimDeeds-*.jar dist/plugins/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git diff --cached --quiet && exit 0
          git commit -m "CI: publish built jars and fetched plugins to dist/ [skip ci]"
          git push
